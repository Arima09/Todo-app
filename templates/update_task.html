<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Update Task</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<!-- Update Task Page -->
<body class="update-task-page">
    <div class="container">
        <h1>Update Task</h1>
        <form method="POST" action="{{ url_for('update_task', task_id=task['id']) }}" class="update-task-form">
            <label for="title">Task Title</label>
            <input type="text" name="title" value="{{ task['title'] }}" required class="task-input" placeholder="Enter task title">

            <label for="priority">Priority</label>
            <select name="priority" class="priority-select">
                <option value="High" {% if task['priority'] == 'High' %}selected{% endif %}>High</option>
                <option value="Medium" {% if task['priority'] == 'Medium' %}selected{% endif %}>Medium</option>
                <option value="Low" {% if task['priority'] == 'Low' %}selected{% endif %}>Low</option>
            </select>

            <div class="form-actions">
                <button type="submit" class="update-btn">Update Task</button>
                <a href="/" class="cancel-btn">Cancel</a>
            </div>
        </form>
    </div>
</body>
</html>
